<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SC2 Build Timer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
  :root {
    --bg: #0b0a10;
    --panel: #16131d;
    --panel-raised: #1d1826;
    --border: #2c2536;
    --text: #ede8f2;
    --text-dim: #8d84a0;
    --accent: #b8ff4d;
    --accent-dim: #6f8f3a;
    --warn: #ff7a45;
    --danger: #ff5470;
    --font-display: "Rajdhani", "Segoe UI", Arial, sans-serif;
    --font-mono: "JetBrains Mono", "Consolas", "Courier New", monospace;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-display);
  }

  body {
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 40px 16px;
  }

  button, input, select { font-family: inherit; }

  .hud {
    width: 100%;
    max-width: 400px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 30px 60px -30px rgba(0, 0, 0, 0.7);
  }

  .hud-header {
    padding: 20px 24px 0;
    text-align: center;
  }

  .wordmark {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.32em;
    color: var(--accent);
    text-transform: uppercase;
    text-wrap: balance;
  }

  .build-name {
    margin-top: 6px;
    font-size: 13px;
    color: var(--text-dim);
    font-weight: 500;
    min-height: 18px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .clock {
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
    font-size: 76px;
    font-weight: 700;
    text-align: center;
    padding: 6px 0 2px;
    letter-spacing: 0.02em;
  }

  .clock-state {
    text-align: center;
    font-size: 11px;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 18px;
  }

  .clock-state.is-running { color: var(--accent); }
  .clock-state.is-paused { color: var(--warn); }

  .next {
    margin: 0 20px 18px;
    padding: 16px 18px;
    background: var(--panel-raised);
    border: 1px solid var(--border);
    border-radius: 8px;
    text-align: center;
  }

  .next-heading {
    font-size: 11px;
    letter-spacing: 0.28em;
    color: var(--text-dim);
    text-transform: uppercase;
  }

  .next-label {
    font-size: 26px;
    font-weight: 700;
    color: var(--accent);
    margin-top: 4px;
    text-wrap: balance;
    transition: color 0.2s ease;
  }

  .next-label.is-imminent { color: var(--warn); }

  .next-countdown {
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
    font-size: 14px;
    color: var(--text-dim);
    margin-top: 4px;
  }

  @keyframes pulse-ring {
    0%, 100% { box-shadow: 0 0 0 0 rgba(184, 255, 77, 0); }
    50% { box-shadow: 0 0 0 4px rgba(184, 255, 77, 0.12); }
  }

  .next.is-imminent {
    animation: pulse-ring 1s ease-in-out infinite;
    border-color: var(--warn);
  }

  @media (prefers-reduced-motion: reduce) {
    .next.is-imminent { animation: none; }
  }

  .timeline-wrap {
    margin: 0 20px 16px;
    border-top: 1px solid var(--border);
    padding-top: 12px;
  }

  .timeline-heading {
    font-size: 11px;
    letter-spacing: 0.28em;
    color: var(--text-dim);
    text-transform: uppercase;
    padding: 0 2px 8px;
  }

  .timeline {
    list-style: none;
    margin: 0;
    padding: 0;
    max-height: 220px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
  }

  .timeline::-webkit-scrollbar { width: 6px; }
  .timeline::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .timeline li {
    display: flex;
    align-items: baseline;
    gap: 12px;
    padding: 6px 2px;
    font-size: 14px;
    border-bottom: 1px solid rgba(44, 37, 54, 0.5);
  }

  .timeline li:last-child { border-bottom: none; }

  .timeline .t-time {
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
    color: var(--text-dim);
    flex-shrink: 0;
    width: 48px;
  }

  .timeline .t-label { flex: 1; }

  .timeline li.completed {
    color: var(--text-dim);
    text-decoration: line-through;
    text-decoration-color: var(--border);
  }

  .timeline li.completed .t-time { color: var(--border); }

  .timeline li.next-up .t-label { color: var(--accent); font-weight: 600; }
  .timeline li.next-up .t-time { color: var(--accent); }

  .timeline .empty {
    color: var(--text-dim);
    font-size: 13px;
    padding: 10px 2px;
  }

  .transport {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 1px;
    background: var(--border);
    border-top: 1px solid var(--border);
  }

  .transport button, .transport label {
    background: var(--panel-raised);
    color: var(--text);
    border: none;
    padding: 14px 4px;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-align: center;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .transport button:hover:not(:disabled), .transport label:hover { background: #241d30; }
  .transport button:disabled { color: var(--border); cursor: default; }
  .transport button:focus-visible, .transport label:focus-within {
    outline: 2px solid var(--accent);
    outline-offset: -2px;
  }

  #startBtn:not(:disabled) { color: var(--accent); }
  #pauseBtn:not(:disabled) { color: var(--warn); }
  #resetBtn:not(:disabled) { color: var(--danger); }

  .build-library {
    padding: 14px 20px;
    border-top: 1px solid var(--border);
  }

  .build-library-heading {
    font-size: 11px;
    letter-spacing: 0.28em;
    color: var(--text-dim);
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .race-tabs {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
    margin-bottom: 8px;
  }

  .race-tab {
    background: var(--panel-raised);
    color: var(--text-dim);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 6px 4px;
    font-family: var(--font-display);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.06em;
    cursor: pointer;
    touch-action: manipulation;
  }

  .race-tab.is-active {
    color: var(--bg);
    background: var(--accent);
    border-color: var(--accent);
  }

  .build-list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .build-list li {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    background: var(--panel-raised);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 10px;
  }

  .build-list .b-info { display: flex; flex-direction: column; min-width: 0; }
  .build-list .b-name { font-size: 13px; font-weight: 600; }
  .build-list .b-matchup { font-size: 11px; color: var(--text-dim); }

  .build-library-note {
    font-size: 10px;
    color: var(--text-dim);
    margin-top: 8px;
    line-height: 1.4;
  }

  .settings {
    padding: 14px 20px 0;
    border-top: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .settings-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .settings-row span {
    font-size: 12px;
    color: var(--text-dim);
    letter-spacing: 0.04em;
    flex-shrink: 0;
  }

  select, input[type="text"], input[type="number"] {
    background: var(--panel-raised);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 6px 8px;
    /* Must stay >=16px: iOS Safari auto-zooms the whole page on focus for
       any input with a smaller font size, which is disorienting. */
    font-size: 16px;
  }

  select, input[type="text"] { max-width: 190px; }
  input[type="number"] { width: 64px; font-family: var(--font-mono); }

  button, label[for="importInput"] { touch-action: manipulation; }

  .voice-row { display: flex; gap: 6px; align-items: center; }
  .voice-row select { max-width: 150px; }

  .mini-btn {
    background: var(--panel-raised);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 5px 10px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.06em;
    cursor: pointer;
    touch-action: manipulation;
    white-space: nowrap;
  }

  .mini-btn:hover { background: #241d30; }

  input[type="range"] {
    flex: 1;
    accent-color: var(--accent);
    max-width: 190px;
  }

  .status {
    font-size: 11px;
    color: var(--text-dim);
    min-height: 14px;
    padding: 6px 20px 14px;
  }

  .status.is-error { color: var(--danger); }

  /* --- Build order editor --- */

  .editor {
    border-top: 1px solid var(--border);
  }

  .editor summary {
    padding: 12px 20px;
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--text-dim);
    cursor: pointer;
    user-select: none;
  }

  .editor summary:hover { color: var(--text); }
  .editor[open] summary { color: var(--accent); }

  .editor-body {
    padding: 4px 20px 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .editor-row {
    display: flex;
    gap: 8px;
  }

  .editor-row input[type="text"] { flex: 1; max-width: none; }

  .editor button[type="button"], .editor button[type="submit"] {
    background: var(--panel-raised);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 6px 12px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.06em;
    cursor: pointer;
    white-space: nowrap;
  }

  .editor button[type="button"]:hover, .editor button[type="submit"]:hover { background: #241d30; }

  .source-list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 1px;
    background: var(--border);
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
    max-height: 180px;
    overflow-y: auto;
  }

  .source-list li {
    background: var(--panel-raised);
    padding: 7px 10px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
  }

  .source-list .s-time {
    font-family: var(--font-mono);
    color: var(--text-dim);
    flex-shrink: 0;
  }

  .source-list .s-label { flex: 1; }

  .source-list .s-remove {
    background: transparent;
    border: none;
    color: var(--text-dim);
    cursor: pointer;
    font-size: 15px;
    line-height: 1;
    padding: 2px 4px;
  }

  .source-list .s-remove:hover { color: var(--danger); }

  .source-list .empty { color: var(--text-dim); padding: 10px; }

  .add-event {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 12px;
    background: var(--panel-raised);
    border: 1px solid var(--border);
    border-radius: 6px;
  }

  .add-event input[type="text"] { width: 100%; max-width: none; }

  .checkbox-row {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--text-dim);
    cursor: pointer;
  }

  .field-row {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }

  .field-row span { font-size: 11px; color: var(--text-dim); }
  .field-row input[type="text"] { width: 76px; max-width: 76px; }
  .field-row input[type="number"] { width: 68px; }

  .add-event-submit {
    background: var(--accent-dim);
    color: var(--bg);
    border: none;
    margin-top: 2px;
  }

  .add-event-submit:hover { background: var(--accent); }

  .editor-actions { display: flex; justify-content: flex-end; }
</style>
</head>
<body>

<div class="hud">
  <div class="hud-header">
    <div class="wordmark">SC2 Build Timer</div>
    <div class="build-name" id="buildName">—</div>
  </div>

  <div class="clock" id="clock">00:00</div>
  <div class="clock-state" id="clockState">Stopped</div>

  <div class="next" id="nextCard">
    <div class="next-heading">Next</div>
    <div class="next-label" id="nextLabel">—</div>
    <div class="next-countdown" id="nextCountdown"></div>
  </div>

  <div class="timeline-wrap">
    <div class="timeline-heading">Timeline</div>
    <ul class="timeline" id="timeline"></ul>
  </div>

  <div class="transport">
    <label for="importInput">Import
      <input type="file" id="importInput" accept="application/json,.json" hidden />
    </label>
    <button id="startBtn" type="button">Start</button>
    <button id="pauseBtn" type="button" disabled>Pause</button>
    <button id="resetBtn" type="button" disabled>Reset</button>
  </div>

  <div class="build-library">
    <div class="build-library-heading">Load a build order</div>
    <div class="race-tabs" id="raceTabs">
      <button type="button" class="race-tab" data-race="Zerg">Zerg</button>
      <button type="button" class="race-tab" data-race="Terran">Terran</button>
      <button type="button" class="race-tab" data-race="Protoss">Protoss</button>
    </div>
    <ul class="build-list" id="buildList"></ul>
    <div class="build-library-note" id="buildLibraryNote"></div>
  </div>

  <div class="settings">
    <div class="settings-row">
      <span>Voice</span>
      <div class="voice-row">
        <select id="voiceSelect"></select>
        <button type="button" class="mini-btn" id="testVoiceBtn">Test</button>
      </div>
    </div>
    <div class="settings-row">
      <span>Rate</span>
      <input type="range" id="rateInput" min="0.7" max="1.6" step="0.05" value="1.05" />
    </div>
    <div class="settings-row">
      <span>Pitch</span>
      <input type="range" id="pitchInput" min="0.5" max="1.5" step="0.05" value="0.9" />
    </div>
    <div class="settings-row">
      <span>Default warning lead</span>
      <input type="number" id="warningInput" min="0" max="60" value="10" /> <span>sec</span>
    </div>
  </div>

  <div class="status" id="status"></div>

  <details class="editor" id="editorDetails">
    <summary>Edit build order</summary>
    <div class="editor-body">
      <div class="editor-row">
        <input type="text" id="buildNameInput" placeholder="Build name" />
        <input type="text" id="buildMatchupInput" placeholder="Matchup (optional)" style="max-width:120px" />
        <button type="button" id="newBuildBtn">New</button>
      </div>

      <ul class="source-list" id="sourceList"></ul>

      <div class="add-event" id="addEventForm">
        <input type="text" id="eventLabel" placeholder="Event name (e.g. Start Lair, MULE, Chrono Nexus)" />

        <label class="checkbox-row">
          <input type="checkbox" id="eventRecurring" /> Repeats (e.g. injects, MULEs, chronoboost)
        </label>

        <div class="field-row" id="singleTimeRow">
          <span>At</span>
          <input type="text" inputmode="numeric" id="eventTime" placeholder="mm:ss" />
        </div>

        <div class="field-row recurring-fields" id="recurringFields" hidden>
          <span>Start</span>
          <input type="text" inputmode="numeric" id="eventStartTime" placeholder="mm:ss" />
          <span>Every</span>
          <input type="number" inputmode="numeric" id="eventInterval" placeholder="sec" min="1" />
          <span>Until</span>
          <input type="text" inputmode="numeric" id="eventEndTime" placeholder="mm:ss" />
        </div>

        <div class="field-row">
          <span>Warn</span>
          <input type="number" inputmode="numeric" id="eventWarning" placeholder="default" min="0" />
          <span>sec before</span>
        </div>

        <button type="button" class="add-event-submit" id="addEventBtn">Add Event</button>
      </div>

      <div class="editor-actions">
        <button type="button" id="exportBtn">Download as JSON</button>
      </div>
    </div>
  </details>
</div>

<script>
  // ---------- Core scheduling logic (framework/DOM-free, unit tested) ----------

  const GameTime = {
    parse(text) {
      const m = /^(\d{1,3}):([0-5]?\d)$/.exec(String(text).trim());
      if (!m) throw new Error(`Invalid time "${text}", expected mm:ss.`);
      return parseInt(m[1], 10) * 60 + parseInt(m[2], 10);
    },
    format(totalSeconds) {
      const s = Math.max(0, Math.round(totalSeconds));
      return `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`;
    },
  };

  const DEFAULT_RECURRING_WINDOW_SECONDS = 20 * 60;

  function buildTimeline(file) {
    const events = [];
    for (const dto of file.events || []) {
      const label = dto.text;
      if (!label) throw new Error("An event is missing its 'text'.");
      const warningSeconds = dto.warningSeconds ?? (dto.recurring ? 0 : (file.defaultWarningSeconds ?? 10));

      if (dto.recurring) {
        if (!dto.startTime) throw new Error(`Recurring event "${label}" is missing 'startTime'.`);
        if (!dto.intervalSeconds || dto.intervalSeconds <= 0) throw new Error(`Recurring event "${label}" needs a positive 'intervalSeconds'.`);
        const start = GameTime.parse(dto.startTime);
        const end = dto.endTime ? GameTime.parse(dto.endTime) : start + DEFAULT_RECURRING_WINDOW_SECONDS;
        for (let t = start; t <= end; t += dto.intervalSeconds) {
          events.push(makeEvent(t, label, dto, warningSeconds));
        }
      } else {
        if (!dto.time) throw new Error(`Event "${label}" is missing a 'time'.`);
        events.push(makeEvent(GameTime.parse(dto.time), label, dto, warningSeconds));
      }
    }
    events.sort((a, b) => a.time - b.time);
    return events;
  }

  function makeEvent(time, label, dto, warningSeconds) {
    return {
      time,
      label,
      speech: label,
      warningSeconds,
      warningSpeech: dto.warningText ?? `${Math.round(warningSeconds)} seconds until ${label}`,
    };
  }

  class CueScheduler {
    constructor(events) {
      this.events = events;
      this.warningFired = events.map(() => false);
      this.mainFired = events.map(() => false);
    }
    poll(elapsed) {
      const fired = [];
      this.events.forEach((ev, i) => {
        if (!this.warningFired[i] && ev.warningSeconds > 0) {
          const warnAt = ev.time - ev.warningSeconds;
          if (warnAt >= 0 && elapsed >= warnAt) {
            this.warningFired[i] = true;
            fired.push({ kind: "warning", event: ev, speech: ev.warningSpeech });
          }
        }
        if (!this.mainFired[i] && elapsed >= ev.time) {
          this.mainFired[i] = true;
          fired.push({ kind: "main", event: ev, speech: ev.speech });
        }
      });
      return fired;
    }
    reset() {
      this.warningFired.fill(false);
      this.mainFired.fill(false);
    }
    getNextIndex(elapsed) {
      return this.events.findIndex((e) => e.time > elapsed);
    }
  }

  class GameClock {
    constructor() {
      this._accumulated = 0;
      this._runStartedAt = 0;
      this.state = "stopped";
    }
    get elapsed() {
      return this.state === "running" ? this._accumulated + (performance.now() / 1000 - this._runStartedAt) : this._accumulated;
    }
    start() {
      if (this.state === "running") return;
      this._runStartedAt = performance.now() / 1000;
      this.state = "running";
    }
    pause() {
      if (this.state !== "running") return;
      this._accumulated += performance.now() / 1000 - this._runStartedAt;
      this.state = "paused";
    }
    reset() {
      this._accumulated = 0;
      this.state = "stopped";
    }
  }

  // ---------- Built-in build library ----------
  // Reflects patch 5.0.16 (8 starting workers, down from 12 - the biggest
  // economy change in years) at a structural level: right buildings/tech in
  // the right order, using the handful of concrete numbers that are publicly
  // confirmed for this patch (hatch-before-pool macro timing, the 2:30 third
  // hatchery, Ghost dropping to 1 supply, permanent Oracle Stasis Ward, etc).
  // Exact seconds beyond those confirmed points are estimates, not pulled
  // from verified replays - this patch is ~2 months old with two hotfixes
  // already, so treat these as a starting point and adjust via "Edit build
  // order" once you see how they actually play out for you.
  const PATCH_NOTE = "Estimated for patch 5.0.16 (8-worker start) - verify against your own games.";

  const BUILTIN_BUILDS = {
    Zerg: [
      {
        name: "Standard Macro Opener",
        matchup: "ZvX",
        note: PATCH_NOTE,
        defaultWarningSeconds: 10,
        events: [
          { time: "00:15", text: "First overlord" },
          { time: "01:20", text: "Natural hatchery" },
          { time: "01:35", text: "Spawning pool" },
          { time: "01:50", text: "Extractor, start zergling speed" },
          { time: "02:05", text: "Queen x2" },
          { time: "02:30", text: "Third hatchery" },
          { time: "03:15", text: "Second overlord wave, start evolution chamber" },
          { time: "04:00", text: "Lair" },
          { recurring: true, text: "Inject", startTime: "02:15", intervalSeconds: 40, endTime: "14:00", warningSeconds: 0 },
        ],
      },
      {
        name: "12 Pool Speedling Timing",
        matchup: "ZvT",
        note: PATCH_NOTE,
        defaultWarningSeconds: 8,
        events: [

  function setStatus(message, isError) {
    el.status.textContent = message || "";
    el.status.classList.toggle("is-error", Boolean(isError));
  }

  // ---------- App state ----------

  const clock = new GameClock();
  let buildFile = null;
  let scheduler = null;

  function loadBuild(file, { persist } = { persist: true }) {
    const timeline = buildTimeline(file);
    buildFile = file;
    scheduler = new CueScheduler(timeline);
    clock.reset();
    lastScrolledIndex = null;
    el.buildName.textContent = file.matchup ? `${file.name} (${file.matchup})` : file.name;
    el.warningInput.value = file.defaultWarningSeconds ?? 10;
    el.buildNameInput.value = file.name;
    el.buildMatchupInput.value = file.matchup || "";
    if (persist) {
      try { localStorage.setItem("sc2timer.lastBuild", JSON.stringify(file)); } catch (_) { /* unavailable, e.g. private browsing */ }
    }
    renderSourceList();
    render();
    updateButtons();
  }

  function renderSourceList() {
    el.sourceList.innerHTML = "";
    if (!buildFile || buildFile.events.length === 0) {
      el.sourceList.innerHTML = '<li class="empty">No events yet — add one below.</li>';
      return;
    }
    buildFile.events.forEach((dto, index) => {
      const li = document.createElement("li");
      const timeText = dto.recurring
        ? `${dto.startTime} +${dto.intervalSeconds}s`
        : (dto.time || "?");
      const timeSpan = document.createElement("span");
      timeSpan.className = "s-time";
      timeSpan.textContent = timeText;
      const labelSpan = document.createElement("span");
      labelSpan.className = "s-label";
      labelSpan.textContent = dto.text;
      const removeBtn = document.createElement("button");
      removeBtn.type = "button";
      removeBtn.className = "s-remove";
      removeBtn.textContent = "×";
      removeBtn.setAttribute("aria-label", `Remove ${dto.text}`);
      removeBtn.addEventListener("click", () => {
        buildFile.events.splice(index, 1);
        loadBuild(buildFile);
      });
      li.append(timeSpan, labelSpan, removeBtn);
      el.sourceList.appendChild(li);
    });
  }

  let lastScrolledIndex = null;

  function render() {
    const elapsed = clock.elapsed;
    el.clock.textContent = GameTime.format(elapsed);

    if (!scheduler || scheduler.events.length === 0) {
      el.nextLabel.textContent = "—";
      el.nextCountdown.textContent = "";
      el.nextCard.classList.remove("is-imminent");
      el.nextLabel.classList.remove("is-imminent");
      el.timeline.innerHTML = '<li class="empty">No events yet — use Edit build order below.</li>';
      return;
    }

    const nextIndex = scheduler.getNextIndex(elapsed);
    const next = nextIndex === -1 ? null : scheduler.events[nextIndex];
    const remaining = next ? Math.max(0, next.time - elapsed) : null;
    const imminent = remaining !== null && remaining <= 5;

    el.nextLabel.textContent = next ? next.label : "Build complete";
    el.nextCountdown.textContent = next ? `in ${Math.ceil(remaining)}s` : "";
    el.nextLabel.classList.toggle("is-imminent", imminent);
    el.nextCard.classList.toggle("is-imminent", imminent);

    el.timeline.innerHTML = "";
    scheduler.events.forEach((ev, i) => {
      const li = document.createElement("li");
      const isCompleted = ev.time <= elapsed;
      li.className = isCompleted ? "completed" : (i === nextIndex ? "next-up" : "");
      const timeSpan = document.createElement("span");
      timeSpan.className = "t-time";
      timeSpan.textContent = GameTime.format(ev.time);
      const labelSpan = document.createElement("span");
      labelSpan.className = "t-label";
      labelSpan.textContent = ev.label;
      li.append(timeSpan, labelSpan);
      el.timeline.appendChild(li);
    });

    // Only auto-scroll when the "next" event actually changes, so this doesn't
    // fight the user's own scrolling on every animation frame.
    if (nextIndex !== lastScrolledIndex) {
      lastScrolledIndex = nextIndex;
      const activeItem = el.timeline.children[Math.max(0, nextIndex === -1 ? scheduler.events.length - 1 : nextIndex)];
      activeItem?.scrollIntoView({ block: "center" });
    }
  }

  function updateButtons() {
    const hasEvents = Boolean(scheduler && scheduler.events.length > 0);
    el.startBtn.disabled = !hasEvents || clock.state === "running";
    el.pauseBtn.disabled = !hasEvents || clock.state !== "running";
    el.resetBtn.disabled = !hasEvents || clock.state === "stopped";
    el.clockState.textContent = clock.state[0].toUpperCase() + clock.state.slice(1);
    el.clockState.classList.toggle("is-running", clock.state === "running");
    el.clockState.classList.toggle("is-paused", clock.state === "paused");
  }

  // ---------- Transport controls (wired unconditionally, before speech setup) ----------

  el.startBtn.addEventListener("click", () => {
    clock.start();
    // iOS Safari only allows speechSynthesis.speak() to start from code
    // running synchronously inside a real user gesture like this click -
    // calls made later from the tick loop are silently ignored otherwise.
    // Speaking here, directly in the tap, unlocks audio for the rest of the
    // session and doubles as an immediate confirmation that audio works.
    if (speechSupported) {
      try { speechSynthesis.resume(); } catch (_) { /* ignore */ }
      speak("Timer started");
    }
    updateButtons();
  });
  el.pauseBtn.addEventListener("click", () => {
    clock.pause();
    updateButtons();
  });
  el.resetBtn.addEventListener("click", () => {
    clock.reset();
    scheduler?.reset();
    render();
    updateButtons();
  });
  el.warningInput.addEventListener("change", () => {
    if (buildFile) {
      buildFile.defaultWarningSeconds = Number(el.warningInput.value) || 0;
      loadBuild(buildFile);

  el.importInput.addEventListener("change", async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    try {
      const text = await file.text();
      const parsed = JSON.parse(text);
      if (!parsed.name) throw new Error("Build order is missing a 'name'.");
      if (!Array.isArray(parsed.events)) throw new Error("Build order has no 'events' array.");
      loadBuild(parsed);
      setStatus(`Loaded "${parsed.name}".`);
    } catch (err) {
      setStatus(`Couldn't load build order: ${err.message}`, true);
    }
    e.target.value = "";
  });

  let currentLibraryRace = "Zerg";

  el.newBuildBtn.addEventListener("click", () => {

  function clearEventFields() {
    el.eventLabel.value = "";
    el.eventTime.value = "";
    el.eventStartTime.value = "";
    el.eventInterval.value = "";
    el.eventEndTime.value = "";
    el.eventWarning.value = "";
    el.eventRecurring.checked = false;
    el.singleTimeRow.hidden = false;
    el.recurringFields.hidden = true;
  }

  function handleAddEvent() {
    if (!buildFile) {
      loadBuild({ name: "My Build", matchup: "", defaultWarningSeconds: Number(el.warningInput.value) || 10, events: [] });
    }
    try {
      const label = el.eventLabel.value.trim();
      if (!label) throw new Error("Give the event a name.");

      const warningRaw = el.eventWarning.value.trim();
      const dto = { text: label };
      if (warningRaw !== "") dto.warningSeconds = Number(warningRaw);

      if (el.eventRecurring.checked) {
        GameTime.parse(el.eventStartTime.value);
        if (!el.eventInterval.value || Number(el.eventInterval.value) <= 0) throw new Error("Enter a positive repeat interval in seconds.");
        dto.recurring = true;
        dto.startTime = el.eventStartTime.value.trim();
        dto.intervalSeconds = Number(el.eventInterval.value);
        if (el.eventEndTime.value.trim()) {
          GameTime.parse(el.eventEndTime.value);
          dto.endTime = el.eventEndTime.value.trim();
        }
      } else {
        GameTime.parse(el.eventTime.value);
        dto.time = el.eventTime.value.trim();
      }

      buildFile.events.push(dto);
      loadBuild(buildFile);
      setStatus(`Added "${label}".`);
      clearEventFields();
    } catch (err) {
      setStatus(err.message, true);
    }
  }

  // A plain button + click handler, not a <form>/submit — mobile Safari's
  // keyboard "Go"/"Done" key on a form field can trigger native submission
  // behavior that's inconsistent across iOS versions, so we avoid forms
  // entirely for this control.
  el.addEventBtn.addEventListener("click", handleAddEvent);
  el.eventLabel.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      e.preventDefault();
      handleAddEvent();
    }
  });

  el.exportBtn.addEventListener("click", () => {
    if (!buildFile) return;
    try {
      const blob = new Blob([JSON.stringify(buildFile, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `${(buildFile.name || "build-order").toLowerCase().replace(/[^a-z0-9]+/g, "-")}.json`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    } catch (err) {
      setStatus(`Couldn't export: ${err.message}. Downloads only work when this file is open directly in a browser tab.`, true);
    }
  });

  // ---------- Speech (guarded: the rest of the app must work even if this is unavailable) ----------

  const speechSupported = typeof window.speechSynthesis !== "undefined" && typeof SpeechSynthesisUtterance !== "undefined";
  let selectedVoice = null;

  let savedVoicePrefs = null;
  try {
    const raw = localStorage.getItem("sc2timer.voicePrefs");
    if (raw) savedVoicePrefs = JSON.parse(raw);
  } catch (_) { /* unavailable */ }
  if (savedVoicePrefs) {
    if (savedVoicePrefs.rate) el.rateInput.value = savedVoicePrefs.rate;
    if (savedVoicePrefs.pitch) el.pitchInput.value = savedVoicePrefs.pitch;
  }

  function saveVoicePrefs() {
    try {
      localStorage.setItem("sc2timer.voicePrefs", JSON.stringify({
        voiceName: selectedVoice ? selectedVoice.name : null,
        rate: el.rateInput.value,
        pitch: el.pitchInput.value,
      }));
    } catch (_) { /* unavailable */ }
  }

  function speak(text) {
    if (!speechSupported) return;
    try {
      const utterance = new SpeechSynthesisUtterance(text);
      if (selectedVoice) utterance.voice = selectedVoice;
      utterance.rate = Number(el.rateInput.value) || 1;
      utterance.pitch = Number(el.pitchInput.value) || 1;
      speechSynthesis.speak(utterance);
    } catch (_) { /* best-effort */ }
  }

  // Web Speech API voices don't expose gender, only a name - these are common
  // naming patterns across Windows/macOS/Chrome/Edge voice packs, used only to
  // sort/label the picker so a female-sounding voice is easy to find quickly.
  const FEMALE_NAME_HINTS = [
    "zira", "aria", "jenny", "samantha", "victoria", "karen", "moira", "tessa",
    "susan", "linda", "salli", "joanna", "kendra", "kimberly", "ivy", "emma",
    "ana", "michelle", "allison", "ava", "serena", "nicky", "female", "woman",
  ];
  const MALE_NAME_HINTS = [
    "david", "mark", "guy", "james", "daniel", "george", "fred", "alex", "tom",
    "christopher", "eric", "ryan", "matthew", "justin", "kevin", "brian", "male",
  ];
  function guessVoiceGender(name) {
    const n = name.toLowerCase();
    if (FEMALE_NAME_HINTS.some((h) => n.includes(h))) return "female";
    if (MALE_NAME_HINTS.some((h) => n.includes(h))) return "male";
    return null;
  }

  // Rough quality ranking so the "best" voices sort first within each gender.
  // "(Natural)" voices (Edge) are neural TTS and sound noticeably less
  // robotic; other non-local voices (Google's cloud voices in Chrome) are
  // usually a step up from the classic offline SAPI voices too.
  function scoreVoiceQuality(v) {
    const n = v.name.toLowerCase();
    if (n.includes("natural")) return 3;
    if (!v.localService) return 2;
    return 1;
  }

  // Known good-sounding voices, best first - tried in order for the initial
  // default.
  const PREFERRED_VOICE_NAMES = [
    "Microsoft Aria Online (Natural)",
    "Microsoft Jenny Online (Natural)",
    "Microsoft Emma Online (Natural)",
    "Google UK English Female",
    "Google US English",
    "Samantha",
    "Victoria",
    "Karen",
    "Microsoft Zira Desktop",
    "Microsoft Zira",
  ];

  const VOICES_PER_GENDER = 5;

  if (speechSupported) {
    try {
      const refreshVoices = () => {
        const voices = speechSynthesis.getVoices();
        const previous = el.voiceSelect.value || (savedVoicePrefs && savedVoicePrefs.voiceName) || "";
        el.voiceSelect.innerHTML = "";

        // English only, and capped at the 5 best-guessed female + 5 best-guessed
        // male voices, so the picker stays short instead of listing every
        // installed language/voice (which can easily be 50-100+ entries).
        const english = voices.filter((v) => v.lang.startsWith("en"));
        const byQualityDesc = (a, b) => scoreVoiceQuality(b) - scoreVoiceQuality(a);
        const female = english.filter((v) => guessVoiceGender(v.name) === "female").sort(byQualityDesc).slice(0, VOICES_PER_GENDER);
        const male = english.filter((v) => guessVoiceGender(v.name) === "male").sort(byQualityDesc).slice(0, VOICES_PER_GENDER);
        const curated = female.concat(male);

        const addGroup = (label, list) => {
          if (list.length === 0) return;
          const group = document.createElement("optgroup");
          group.label = label;
          list.forEach((v) => {
            const opt = document.createElement("option");
            opt.value = v.name;
            const star = scoreVoiceQuality(v) >= 3 ? "★ " : "";
            opt.textContent = `${star}${v.name}${v.localService ? "" : " · online"}`;
            group.appendChild(opt);
          });
          el.voiceSelect.appendChild(group);
        };
        addGroup("Female", female);
        addGroup("Male", male);

        if (previous && curated.some((v) => v.name === previous)) {
          el.voiceSelect.value = previous;
        } else {
          const preferred = PREFERRED_VOICE_NAMES.map((name) => curated.find((v) => v.name === name)).find(Boolean);
          if (preferred || curated[0]) el.voiceSelect.value = (preferred || curated[0]).name;
        }
        selectedVoice = curated.find((v) => v.name === el.voiceSelect.value) || null;
      };
      speechSynthesis.addEventListener("voiceschanged", refreshVoices);
      refreshVoices();
      el.voiceSelect.addEventListener("change", (e) => {
        selectedVoice = speechSynthesis.getVoices().find((v) => v.name === e.target.value) || null;
        saveVoicePrefs();
      });
      el.rateInput.addEventListener("change", saveVoicePrefs);
      el.pitchInput.addEventListener("change", saveVoicePrefs);
      el.testVoiceBtn.addEventListener("click", () => speak("Third hatchery. Inject. Start Lair."));
    } catch (err) {
      setStatus("Voice list unavailable, but speech may still work.", false);
    }
  } else {
    el.voiceSelect.innerHTML = '<option>Not supported in this browser</option>';
    el.voiceSelect.disabled = true;
    el.testVoiceBtn.disabled = true;
    setStatus("This browser/context doesn't expose text-to-speech, so cues will be silent. Try opening this file directly in Chrome or Edge.", true);
  }

  // ---------- Tick loop ----------

  function tick() {
    if (scheduler && clock.state === "running") {
      for (const cue of scheduler.poll(clock.elapsed)) {
        speak(cue.speech);
      }
    }
    render();
    requestAnimationFrame(tick);
  }

  // ---------- Startup ----------

  let initial = { ...BUILTIN_BUILDS.Zerg[0], race: "Zerg" };
  let loadedFromStorage = false;
  try {
    const saved = localStorage.getItem("sc2timer.lastBuild");
    if (saved) {
      initial = JSON.parse(saved);
      loadedFromStorage = true;
    }
  } catch (_) { /* localStorage unavailable */ }

  try {
    loadBuild(initial, { persist: false });
    if (!loadedFromStorage) setStatus('Loaded a sample build. Use "Load a build order" below to browse by race, "Edit build order" to add your own events, or Import a JSON file.');
  } catch (err) {
    setStatus(`Couldn't load saved build: ${err.message}`, true);
    loadBuild({ name: "My Build", matchup: "", defaultWarningSeconds: 10, events: [] }, { persist: false });
  }

  requestAnimationFrame(tick);
</script>
</body>
</html>
